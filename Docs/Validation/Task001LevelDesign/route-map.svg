<text x="45.00" y="49.00" font-size="28" font-weight="bold" text-anchor="start">TASK-001 · MorgueRouteTest — фактическое пространство</text>
<text x="45.00" y="87.00" font-size="17" font-weight="normal" text-anchor="start">Снимок Unity 24.10.2026 · 15 участков пола · 27 Сталкеров · 11 дверей, из них 6 карточных</text>
<text x="1215.00" y="151.00" font-size="16" font-weight="bold" text-anchor="start">УЧАСТКИ</text>
<text x="1215.00" y="173.00" font-size="16" font-weight="normal" text-anchor="start"></text>
<text x="1215.00" y="195.00" font-size="16" font-weight="normal" text-anchor="start">S     Стартовый морг, фонарь</text>
<text x="1215.00" y="217.00" font-size="16" font-weight="normal" text-anchor="start">C0   Входной коридор</text>
<text x="1215.00" y="239.00" font-size="16" font-weight="normal" text-anchor="start">H    Распределительный зал</text>
<text x="1215.00" y="261.00" font-size="16" font-weight="normal" text-anchor="start">ER   Восточный подход</text>
<text x="1215.00" y="283.00" font-size="16" font-weight="normal" text-anchor="start">ED   Восточный спуск</text>
<text x="1215.00" y="305.00" font-size="16" font-weight="normal" text-anchor="start">G    Зелёная карта</text>
<text x="1215.00" y="327.00" font-size="16" font-weight="normal" text-anchor="start">R    Служебный возврат</text>
<text x="1215.00" y="349.00" font-size="16" font-weight="normal" text-anchor="start">P    Пистолет</text>
<text x="1215.00" y="371.00" font-size="16" font-weight="normal" text-anchor="start">A    Боезапас перед ареной</text>
<text x="1215.00" y="393.00" font-size="16" font-weight="normal" text-anchor="start">B    Арена, синяя карта</text>
<text x="1215.00" y="415.00" font-size="16" font-weight="normal" text-anchor="start">W    Западный возврат</text>
<text x="1215.00" y="437.00" font-size="16" font-weight="normal" text-anchor="start">O1  Линза, 2 врага</text>
<text x="1215.00" y="459.00" font-size="16" font-weight="normal" text-anchor="start">O2  Дробовик, 10 врагов</text>
<text x="1215.00" y="481.00" font-size="16" font-weight="normal" text-anchor="start">O3  Пустая боковая комната</text>
<text x="1215.00" y="503.00" font-size="16" font-weight="normal" text-anchor="start"></text>
<text x="1215.00" y="525.00" font-size="16" font-weight="bold" text-anchor="start">ОБОЗНАЧЕНИЯ</text>
<text x="1215.00" y="547.00" font-size="16" font-weight="normal" text-anchor="start"></text>
<text x="1215.00" y="569.00" font-size="16" font-weight="normal" text-anchor="start">Красные точки — враги</text>
<text x="1215.00" y="591.00" font-size="16" font-weight="normal" text-anchor="start">Ромбы — подбираемые предметы</text>
<text x="1215.00" y="613.00" font-size="16" font-weight="normal" text-anchor="start">Синие / зелёные линии — замки</text>
<text x="1215.00" y="635.00" font-size="16" font-weight="normal" text-anchor="start">Серые линии — обычные двери</text>
<text x="1215.00" y="657.00" font-size="16" font-weight="normal" text-anchor="start">Штрих — поясняющая трасса</text>
<text x="1215.00" y="679.00" font-size="16" font-weight="normal" text-anchor="start"></text>
<text x="1215.00" y="701.00" font-size="16" font-weight="bold" text-anchor="start">ЧТО ПОКАЗАНО</text>
<text x="1215.00" y="723.00" font-size="16" font-weight="normal" text-anchor="start"></text>
<text x="1215.00" y="745.00" font-size="16" font-weight="normal" text-anchor="start">Реальные позиции и размеры.</text>
<text x="1215.00" y="767.00" font-size="16" font-weight="normal" text-anchor="start">Трасса объясняет порядок;</text>
<text x="1215.00" y="789.00" font-size="16" font-weight="normal" text-anchor="start">это не запись прохождения</text>
<text x="1215.00" y="811.00" font-size="16" font-weight="normal" text-anchor="start">и не проверенный путь AI.</text>
<text x="1215.00" y="833.00" font-size="16" font-weight="normal" text-anchor="start"></text>
<text x="1215.00" y="855.00" font-size="16" font-weight="normal" text-anchor="start">Вне схемы: будущий выход,</text>
<text x="1215.00" y="877.00" font-size="16" font-weight="normal" text-anchor="start">этажи и финал полного демо.</text>
<text x="1215.00" y="899.00" font-size="16" font-weight="normal" text-anchor="start">Их в этой сцене нет.</text>
<text x="45.00" y="1035.00" font-size="16" font-weight="normal" text-anchor="start">Источник: authored-scene.json. Позиции — в Unity units, север (+Y) сверху. Несохранённая сцена прочитана без сохранения.</text>
<text x="45.00" y="1064.00" font-size="16" font-weight="normal" text-anchor="start">Сценарное знакомство, условие стартовой двери и меню разрабатываются отдельно. Их последующие изменения не входят в снимок.</text>
