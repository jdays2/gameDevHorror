<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency Shift · План демо</title>
<style>
:root{color-scheme:dark;--bg:#151719;--panel:#1c1f22;--fg:#e6e8ea;--muted:#a4acb4;--line:#343a40;--link:#a7c9ef;--accent:#9ed9bc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
header{border-bottom:1px solid var(--line);padding:20px max(24px,calc((100% - 1000px)/2));background:var(--panel)}
.brand{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}nav{display:flex;gap:8px 24px;flex-wrap:wrap;margin-top:12px}nav a{color:var(--fg);font-size:14px}
a{color:var(--link);text-underline-offset:3px}a:hover{color:#fff}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--link);outline-offset:4px}
main{max-width:1000px;padding:24px;margin:auto}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
.path{font-size:12px;color:var(--muted);overflow-wrap:anywhere;flex-basis:100%}.progress{font-size:14px;color:var(--muted)}button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 12px;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}button:hover{background:var(--panel)}#status{font-size:13px;margin-left:auto;color:var(--accent)}#status.error{color:#ffaaa5}
h1{font-size:30px;line-height:1.25;margin:12px 0 24px;letter-spacing:-.025em}h2{font-size:21px;line-height:1.35;margin:38px 0 16px;border-top:1px solid var(--line);padding-top:24px}h3{font-size:18px;margin-top:26px}p{margin:12px 0;color:#cbd1d6}strong{color:var(--fg)}
.task{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid #252b30}.task input{width:21px;height:21px;flex:0 0 21px;margin:3px 0;accent-color:var(--accent);cursor:pointer}.task-copy{min-width:0;overflow-wrap:anywhere}.task label{cursor:pointer}.task.done label{color:#b5c1b9}.task.done input{opacity:.9}.task input:disabled{cursor:wait}.task:has(input:disabled) label{cursor:default}.task a{display:inline}
code{font:13px/1.6 Consolas,monospace;background:var(--panel);border-radius:4px;padding:2px 5px;overflow-wrap:anywhere}pre{background:var(--panel);padding:16px;overflow:auto;border-radius:6px}pre code{padding:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}.bullet{padding-left:18px;position:relative}.bullet:before{content:'•';position:absolute;left:0;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:28px 0}footer{margin-top:36px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:540px){body{font-size:15px}header{padding:18px}main{padding:18px}nav{gap:8px 18px}h1{font-size:26px}#status{margin-left:0;flex-basis:100%}.task{gap:12px;padding:14px 0}.task input{width:23px;height:23px;flex-basis:23px}}
</style>
</head>
<body>
<header>
<div class="brand">Emergency Shift · демо</div>
<nav aria-label="Навигация проекта">
<a href="/?doc=Docs/MVP_PLAN.md">План демо</a><a href="/?doc=Docs/Tasks/README.md">Разделы</a><a href="/?doc=README.md">Проект</a><a href="/?doc=Docs/Toolbox/MCP.md">MCP</a><a href="/?doc=Docs/Toolbox/CLI.md">CLI</a><a href="/?doc=Docs/Toolbox/SKILLS.md">Skills</a>
</nav>
</header>
<main>
<div class="toolbar">
<span class="path">{{DOCUMENT}}</span>
<span class="progress" id="progress">Выполнено {{DONE}} из {{TOTAL}}</span>
<button type="button" id="filter" aria-pressed="false">Скрыть выполненное</button>
<button type="button" id="reload">Обновить</button>
<span id="status" role="status" aria-live="polite">Изменения сохраняются в Markdown</span>
</div>
<article>{{CONTENT}}</article>
<footer>Галочки сохраняются сразу. Ссылки в пунктах открывают подробности задания.</footer>
</main>
<script>
const state = {{STATE}};
const checks = [...document.querySelectorAll('input[data-line]')];
const status = document.getElementById('status');
const filter = document.getElementById('filter');
let hideDone = false;
let saving = false;
function refresh(){
  document.getElementById('progress').textContent = `Выполнено ${checks.filter(c=>c.checked).length} из ${checks.length}`;
  checks.forEach(c=>{c.closest('.task').classList.toggle('done',c.checked);c.closest('.task').hidden=hideDone&&c.checked;});
  filter.hidden = checks.length === 0;
  document.getElementById('progress').hidden = checks.length === 0;
}
checks.forEach(check=>check.addEventListener('change',async()=>{
  if(saving)return;
  saving=true;
  const previous=!check.checked;
  const enabled=checks.filter(c=>!c.disabled);
  enabled.forEach(c=>c.disabled=true);
  status.classList.remove('error');status.textContent='Сохраняю…';
  try{
    const response=await fetch('/checkbox',{method:'POST',headers:{'Content-Type':'application/json','X-Plan-Token':state.token},body:JSON.stringify({doc:state.doc,line:Number(check.dataset.line),checked:check.checked,revision:state.revision})});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'Не удалось сохранить');
    state.revision=result.revision;
    status.textContent='Сохранено в Markdown';
  }catch(error){check.checked=previous;status.classList.add('error');status.textContent=error.message;}
  finally{saving=false;enabled.forEach(c=>c.disabled=false);refresh();}
}));
filter.addEventListener('click',()=>{hideDone=!hideDone;filter.setAttribute('aria-pressed',String(hideDone));filter.textContent=hideDone?'Показать всё':'Скрыть выполненное';refresh();});
document.getElementById('reload').addEventListener('click',()=>location.reload());
// Follow normal same-page anchors and keep navigation usable inside labels.
document.querySelectorAll('.task a').forEach(a=>a.addEventListener('click',e=>e.stopPropagation()));
refresh();
if(!checks.length){status.textContent='Документ для чтения';}
</script>
</body>
</html>
