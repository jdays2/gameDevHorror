<div id="es-hud-options">
  <div class="es-controls" aria-label="Состояние игрового HUD">
    <div class="es-choice"><button type="button" data-equip="pistol" aria-pressed="false">1 · Пистолет</button><button type="button" data-equip="shotgun" aria-pressed="true">2 · Дробовик</button></div>
    <button type="button" data-lamp aria-pressed="false">Фонарик выключен</button>
  </div>
  <div class="viz-carousel" aria-label="Варианты оружейного HUD" data-previous-label="Назад" data-next-label="Далее">
    <section data-variant="Крупный боезапас" aria-label="Крупный боезапас">
      <div class="es-scene"><div class="es-viewport"><div class="es-health"></div><div class="es-rack es-numbers" data-layout="numbers"></div></div></div>
      <div class="es-details"><div class="es-detail"><div class="es-caption">Оружие · крупно</div><div class="es-close es-numbers" data-layout="numbers"></div></div><div class="es-lamp-detail"><div class="es-caption">Фонарь · выкл / вкл</div><div class="es-lamp-pair"><img data-asset="lampOff" alt="Удлинённое перечёркивание"><img data-asset="lampOn" alt="Фонарик включён"></div></div></div>
    </section>
    <section data-variant="Тихая колонка" aria-label="Тихая колонка" hidden>
      <div class="es-scene"><div class="es-viewport"><div class="es-health"></div><div class="es-rack es-column" data-layout="column"></div></div></div>
      <div class="es-details"><div class="es-detail"><div class="es-caption">Оружие · крупно</div><div class="es-close es-column" data-layout="column"></div></div><div class="es-lamp-detail"><div class="es-caption">Фонарь · выкл / вкл</div><div class="es-lamp-pair"><img data-asset="lampOff" alt="Удлинённое перечёркивание"><img data-asset="lampOn" alt="Фонарик включён"></div></div></div>
    </section>
    <section data-variant="Патроны магазина" aria-label="Патроны магазина" hidden>
      <div class="es-scene"><div class="es-viewport"><div class="es-health"></div><div class="es-rack es-rounds" data-layout="rounds"></div></div></div>
      <div class="es-details"><div class="es-detail"><div class="es-caption">Оружие · крупно</div><div class="es-close es-rounds" data-layout="rounds"></div></div><div class="es-lamp-detail"><div class="es-caption">Фонарь · выкл / вкл</div><div class="es-lamp-pair"><img data-asset="lampOff" alt="Удлинённое перечёркивание"><img data-asset="lampOn" alt="Фонарик включён"></div></div></div>
    </section>
  </div>
</div>
<style>
#es-hud-options{--es-ink:#e1e2d8;--es-dim:#a2aaa5;--es-health:#79956b;--es-ui-bg:light-dark(#e9ece7,#17201e);--es-ui-ink:light-dark(#263530,#d8dfd7);font-family:Arial,sans-serif;color:var(--es-ui-ink)}
#es-hud-options *{box-sizing:border-box}
#es-hud-options .es-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
#es-hud-options .es-choice{display:flex;gap:4px}
#es-hud-options button{font:inherit;font-size:12px;letter-spacing:.02em;padding:9px 12px;border:1px solid color-mix(in srgb,var(--es-ui-ink) 25%,transparent);background:transparent;color:var(--es-ui-ink);border-radius:3px}
#es-hud-options button[aria-pressed=true]{background:var(--es-ui-bg);border-color:var(--es-ui-ink)}
#es-hud-options .es-scene{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#111918 var(--es-scene) center/cover}
#es-hud-options .es-viewport{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:top left;color:var(--es-ink);text-shadow:0 1px 2px #0009;font-family:Arial,sans-serif}
#es-hud-options .es-health{position:absolute;bottom:28px;left:36px;width:270px;height:58px}
#es-hud-options .es-bar{position:absolute;bottom:0;width:270px;height:16px;background:#22302a}
#es-hud-options .es-fill{width:76%;height:100%;background:var(--es-health)}
#es-hud-options .es-hp{position:absolute;right:8px;top:0;font-size:12px;line-height:16px;color:var(--es-ink)}
#es-hud-options .es-lamp{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;font-size:10px}
#es-hud-options .es-lamp img{width:24px;height:24px;object-fit:contain}
#es-hud-options .es-cards{position:absolute;right:0;top:3px;display:flex;gap:10px}
#es-hud-options .es-cards img{width:38px;height:23px;object-fit:contain}
#es-hud-options .es-rack{position:absolute;right:36px;bottom:28px;width:272px;height:126px;color:var(--es-ink)}
#es-hud-options .es-weapon{position:absolute;display:block}
#es-hud-options .es-gun{position:absolute;object-fit:contain;object-position:center;width:154px;height:34px;left:26px;top:4px;filter:drop-shadow(0 1px 1px #0008)}
#es-hud-options .es-gun.pistol{height:36px;width:82px;left:62px}
#es-hud-options .es-key{position:absolute;left:0;top:12px;font-size:12px;color:var(--es-dim)}
#es-hud-options .es-name{position:absolute;left:26px;top:47px;width:154px;text-align:center;font-size:10px;letter-spacing:.1em;white-space:nowrap;color:var(--es-dim)}
#es-hud-options .es-ammo{position:absolute;font-variant-numeric:tabular-nums;font-size:36px;line-height:38px;letter-spacing:-.03em;right:0;top:0;min-width:65px}
#es-hud-options .es-reserve{font-size:14px;color:var(--es-dim);letter-spacing:0}
#es-hud-options .es-column .es-active{width:272px;height:66px;bottom:0;left:0}
#es-hud-options .es-column .es-ammo{display:flex;align-items:baseline;gap:8px;top:3px}
#es-hud-options .es-column .es-spare{width:180px;height:44px;left:29px;bottom:77px;opacity:.38;transform:scale(.78);transform-origin:left bottom}
#es-hud-options .es-spare .es-name{display:none}
#es-hud-options .es-spare .es-gun{filter:none}
#es-hud-options .es-numbers .es-active{width:272px;height:66px;bottom:0;right:0}
#es-hud-options .es-numbers .es-active .es-key{left:93px;top:10px}
#es-hud-options .es-numbers .es-active .es-gun{left:116px;width:156px;top:3px}
#es-hud-options .es-numbers .es-active .es-gun.pistol{left:150px;width:88px}
#es-hud-options .es-numbers .es-active .es-name{left:116px;width:156px}
#es-hud-options .es-numbers .es-ammo{left:0;right:auto;top:-4px;font-size:48px;line-height:48px}
#es-hud-options .es-numbers .es-reserve{display:block;margin-top:3px;font-size:12px;line-height:14px;letter-spacing:.04em}
#es-hud-options .es-numbers .es-spare{width:180px;height:44px;right:0;bottom:78px;opacity:.35;transform:scale(.72);transform-origin:right bottom}
#es-hud-options .es-rounds .es-active{width:255px;height:82px;bottom:0;right:0}
#es-hud-options .es-rounds .es-active .es-gun{left:25px;top:0;width:160px;height:32px}
#es-hud-options .es-rounds .es-active .es-gun.pistol{left:62px;width:86px}
#es-hud-options .es-rounds .es-active .es-name{left:25px;width:160px;top:39px}
#es-hud-options .es-rounds .es-ammo{right:0;top:54px;font-size:14px;line-height:20px}
#es-hud-options .es-rounds .es-reserve{font-size:14px}
#es-hud-options .es-rounds .es-spare{width:180px;height:44px;left:42px;bottom:90px;opacity:.38;transform:scale(.72);transform-origin:left bottom}
#es-hud-options .es-shells{position:absolute;left:25px;top:63px;display:flex;gap:6px;height:14px;align-items:end}
#es-hud-options .es-shell{width:8px;height:14px;border-radius:2px 2px 0 0;background:var(--es-ink)}
#es-hud-options .es-shell.empty{opacity:.17}
#es-hud-options .es-shell.pistol{width:5px;height:12px}
#es-hud-options .es-details{display:flex;flex-wrap:wrap;align-items:start;gap:20px;min-height:211px;padding-top:15px;color:var(--es-ui-ink)}
#es-hud-options .es-caption{font-size:12px;letter-spacing:.03em;margin-bottom:10px}
#es-hud-options .es-detail{flex:1;min-width:280px}
#es-hud-options .es-close{position:relative;height:150px;width:290px;color:var(--es-ink);background:#27302d url('') center; background-image:linear-gradient(45deg,#38403a88,#0d151844),var(--es-scene);background-size:auto,1000px auto;background-position:center,87% 86%;padding:0;overflow:hidden}
#es-hud-options .es-close .es-active{bottom:8px;left:8px;right:auto}
#es-hud-options .es-close .es-spare{bottom:88px}
#es-hud-options .es-close.es-rounds .es-spare{bottom:103px}
#es-hud-options .es-lamp-detail{min-width:160px}
#es-hud-options .es-lamp-pair{display:flex;gap:30px;align-items:center;padding:15px 15px 25px;background:#27302d}
#es-hud-options .es-lamp-pair img{width:32px;height:32px;object-fit:contain}
@media(max-width:500px){#es-hud-options .es-details{min-height:310px;gap:12px}#es-hud-options .es-lamp-pair{padding:10px 15px}#es-hud-options .es-lamp-pair img{width:24px;height:24px}#es-hud-options button{padding:8px;font-size:11px}}
</style>

const state={weapon:'shotgun',lamp:false,loaded:3};
root.style.setProperty('--es-scene','url("'+assets.scene+'")');
const descriptions={pistol:{name:'ПИСТОЛЕТ',key:'1',capacity:8,reserve:24},shotgun:{name:'ДРОБОВИК',key:'2',capacity:4,reserve:12}};
function gun(id,active,kind){
 const info=descriptions[id];
 let ammo='';
 if(active){
   ammo=kind==='rounds'?'<span class="es-ammo"><span class="es-reserve">/ '+info.reserve+'</span></span><span class="es-shells">'+Array.from({length:info.capacity},(_,i)=>'<i class="es-shell '+(id==='pistol'?'pistol ':'')+(i>=state.loaded?'empty':'')+'"></i>').join('')+'</span>':'<span class="es-ammo">'+(kind==='numbers'?String(state.loaded).padStart(2,'0'):state.loaded)+'<span class="es-reserve">/ '+info.reserve+'</span></span>';
 }
 return '<div class="es-weapon '+(active?'es-active':'es-spare')+'"><span class="es-key">'+info.key+'</span><img class="es-gun '+id+'" src="'+assets[id]+'" alt="'+info.name+'"><span class="es-name">'+info.name+'</span>'+ammo+'</div>';
}
function render(){
 state.loaded=Math.min(state.loaded,descriptions[state.weapon].capacity);
 root.querySelectorAll('[data-asset]').forEach(img=>img.src=assets[img.dataset.asset]);
 root.querySelectorAll('[data-layout]').forEach(el=>el.innerHTML=gun(state.weapon==='shotgun'?'pistol':'shotgun',false,el.dataset.layout)+gun(state.weapon,true,el.dataset.layout));
 root.querySelectorAll('.es-health').forEach(el=>el.innerHTML='<span class="es-lamp"><img src="'+assets[state.lamp?'lampOn':'lampOff']+'" alt="Фонарик '+(state.lamp?'включён':'выключен')+'">F</span><span class="es-cards"><img src="'+assets.green+'" alt="Зелёная карта"><img src="'+assets.blue+'" alt="Синяя карта"><img src="'+assets.red+'" alt="Красная карта"></span><div class="es-bar"><div class="es-fill"></div><span class="es-hp">76</span></div>');
 root.querySelectorAll('[data-equip]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.equip===state.weapon)));
 const lamp=root.querySelector('[data-lamp]');lamp.textContent='Фонарик '+(state.lamp?'включён':'выключен');lamp.setAttribute('aria-pressed',String(state.lamp));
 resize();
}
function resize(){root.querySelectorAll('.es-viewport').forEach(el=>el.style.transform='scale('+el.parentElement.clientWidth/1280+')');}
root.querySelectorAll('[data-equip]').forEach(button=>button.addEventListener('click',()=>{state.weapon=button.dataset.equip;state.loaded=state.weapon==='pistol'?6:3;render();}));
root.querySelector('[data-lamp]').addEventListener('click',()=>{state.lamp=!state.lamp;render();});
render();const observer=new ResizeObserver(resize);observer.observe(root);root.querySelectorAll('.es-scene').forEach(el=>observer.observe(el));
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'loaded',{label:'Патроны в магазине',min:0,max:8,step:1});tweak.addToggle(state,'lamp',{label:'Фонарик включён'});}
})();
</script>
