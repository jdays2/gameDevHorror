<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TASK-006 · четыре новых концепта</title>
<style>body{margin:0;background:#1a1d1d;color:#e5e8e6;font:16px/1.6 system-ui,sans-serif}header{padding:18px 24px}h1{font-size:23px;margin:0 0 5px}p{margin:5px 0;color:#b7c0bc}button,select{font:inherit;padding:7px 11px;margin:4px;background:#2b3130;border:1px solid #606b67;color:#f1f4f2}iframe{width:100%;aspect-ratio:16/9;border:0;display:block}a{color:#e2eae5}#notice{color:#cdc3ad}</style>
<header><h1>TASK-006 · экран смерти без музыки · четыре новых варианта</h1><p>Макеты для выбора. Внедрение не начато. Фон D/E — архивный кадр с живым тестовым игроком, используемый только для композиции.</p>
<select id="variant"><option value="c">C · В языке главного меню</option><option value="d">D · Продолжение паузы</option><option value="e">E · Кадр и нижняя навигация</option><option value="f">F · Тихий центр</option></select>
<select id="state"><option value="fresh">Текущие сцены · с начала</option><option value="checkpoint">С подключённым checkpoint</option><option value="loading">Загрузка</option><option value="error">Ошибка загрузки</option><option value="exit">Подтверждение выхода</option></select>
<button id="replay">Появление</button><button id="large">Текст 125%</button> <a href="board.html">Четыре рядом</a><p id="description"></p><p id="notice">Кнопки показывают только intent; сцену не перезагружают и приложение не закрывают.</p></header>
<iframe id="preview" title="Макет экрана смерти" src="mockup.html?variant=c"></iframe>
<script>const descriptions={c:'C · Логотип, чёрный фон и свободные пункты главного меню. Максимальная преемственность с его композицией.',d:'D · Левая колонка, приглушённый мир и плоские кнопки текущей паузы. Рекомендация как наиболее близкое внутриигровое окно.',e:'E · Последний кадр остаётся справа, сообщение и действия собраны снизу слева. Больше связи с местом гибели.',f:'F · Только крупное сообщение по центру и две команды ниже. Самый тихий и лаконичный вариант.'};const frame=document.querySelector('#preview'),v=document.querySelector('#variant'),s=document.querySelector('#state');let large=false;function update(){frame.src='mockup.html?variant='+v.value+'&state='+s.value+(large?'&large=1':'');document.querySelector('#description').textContent=descriptions[v.value]}v.onchange=s.onchange=update;document.querySelector('#large').onclick=()=>{large=!large;update()};document.querySelector('#replay').onclick=()=>frame.contentWindow.postMessage({type:'replay'},'*');addEventListener('message',e=>{if(e.data?.type==='intent')document.querySelector('#notice').textContent='Демонстрация: '+e.data.value+' · без изменения игры.'});update()</script></html>
