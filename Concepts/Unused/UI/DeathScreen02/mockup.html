<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TASK-006 · экран смерти без музыки</title>
<style>
@font-face{font-family:Noto;src:url('../../../../Assets/EmergencyShift/Fonts/MainMenu/NotoSans-Medium.ttf')}
@font-face{font-family:Barlow;src:url('../../../../Assets/EmergencyShift/Fonts/MainMenu/BarlowCondensed-Bold.ttf')}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0d0c;color:#ededeb;font-family:Noto,sans-serif}
#world{position:absolute;inset:0;background:url('../DeathScreen01/Sources/world-reference.png') center/cover no-repeat;opacity:0;filter:grayscale(.7)}
#veil{position:absolute;inset:0;background:rgba(4,6,6,.88);opacity:0}
#stage{position:absolute;transform-origin:0 0;inset:0 auto auto 0}
.brand{margin:0;color:#a6b8b5;font-size:16px;line-height:1.4;letter-spacing:1.3px}
.logo{display:none;font:700 56px/1.04 Barlow,sans-serif;letter-spacing:-.6px;color:#ededeb;padding-bottom:12px}
.group{position:absolute;left:90px;top:68px;width:560px}
h1{font-size:48px;font-weight:500;letter-spacing:-1px;line-height:1.4;margin:0}
.point{font-size:18px;line-height:1.6;color:#aeb7b4;margin:16px 0 20px;max-width:550px}
.rule{display:none;height:2px;width:36px;background:#9e302b;margin:12px 0 24px}
.actions{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
button{font:500 26px/1.5 Noto,sans-serif;position:relative;cursor:pointer;min-width:420px;max-width:560px;min-height:58px;background:none;border:0;color:#9e9e9e;text-align:left;padding:6px 0;outline:none}
button.active,button:hover,button:focus-visible{color:#ededeb}button:active{opacity:.65}button:disabled{cursor:default;color:#aeb7b4}
.secondary{font-size:20px;margin-top:27px}
.hint{position:absolute;left:90px;bottom:40px;color:#aeb7b4;font-size:16px;line-height:1.6}
.error{display:none;color:#d5bdb7;font-size:18px;line-height:1.6;max-width:540px;margin:16px 0}
.state-error .point{display:none}.state-error .error{display:block}.state-loading .hint{display:none}
.variant-c .brand{display:none}.variant-c .logo{display:block}.variant-c h1{margin-top:53px;font-size:32px;letter-spacing:0}
.variant-c .point{margin:9px 0 22px}.variant-c .actions{gap:10px}.variant-c button{font-size:26px}.variant-c .secondary{font-size:20px}
.variant-d #world{opacity:1;filter:grayscale(.3)}.variant-d #veil{opacity:1}
.variant-d .group{left:192px;top:180px;width:520px}.variant-d h1{font-size:46px;margin-top:20px}
.variant-d .point{font-size:18px;margin:18px 0}.variant-d .rule{display:block}
.variant-d .actions{gap:12px}.variant-d button{background:rgba(18,23,23,.75);color:#e6edeb;padding:10px 18px;min-width:400px;font-size:24px;min-height:58px}
.variant-d button.active,.variant-d button:hover,.variant-d button:focus-visible{background:#293535}
.variant-d .secondary{margin-top:0;font-size:24px}.variant-d .hint{left:192px;bottom:90px}
.variant-e #world{opacity:1;filter:grayscale(.65)}
.variant-e #veil{opacity:1;background:linear-gradient(90deg,#090b0e 0%,rgba(9,11,14,.97) 27%,rgba(9,11,14,.56) 68%,rgba(9,11,14,.45)),linear-gradient(0deg,#090b0e 0%,rgba(9,11,14,.96) 29%,transparent 74%)}
.variant-e .group{top:auto;bottom:124px;left:90px;width:1100px}.variant-e .brand{margin-bottom:16px}.variant-e h1{font-size:48px}
.variant-e .point{margin:8px 0 18px}.variant-e .actions{flex-direction:row;gap:58px;align-items:center}
.variant-e button{min-width:0;padding:8px 0;font-size:26px}.variant-e .secondary{font-size:20px;margin:0}
.variant-f .group{top:179px;left:50%;transform:translateX(-50%);width:800px;text-align:center}
.variant-f .brand{display:none}.variant-f h1{font-size:66px;line-height:1.13;letter-spacing:-1.4px;padding-bottom:16px}.variant-f .error{margin-left:auto;margin-right:auto}
.variant-f .point{margin:26px auto 0;max-width:700px;font-size:18px}
.variant-f .actions{margin-top:77px;align-items:center;gap:8px}.variant-f button{min-width:0;text-align:center;padding:8px 20px;font-size:26px}
.variant-f .secondary{font-size:18px;margin-top:0}.variant-f .hint{left:0;right:0;text-align:center;bottom:38px}
.variant-f button.active:before{content:'•';font-size:17px;position:absolute;left:-4px;top:14px;color:#ededeb}
.large h1{font-size:60px}.large .brand{font-size:20px}.large button{font-size:32.5px;min-height:70px}.large .point,.large .error{font-size:22.5px}.large .secondary{font-size:25px}.large .hint{font-size:20px}
.variant-c.large h1{font-size:40px;margin-top:38px}.variant-c.large button{font-size:32.5px}.variant-c.large .secondary{font-size:25px}
.variant-d.large .group{top:125px}.variant-d.large h1{font-size:57.5px}.variant-d.large button{font-size:30px}.variant-d.large .hint{bottom:40px}
.variant-e.large h1{font-size:60px}.variant-e.large button{font-size:32.5px}.variant-e.large .secondary{font-size:25px}
.variant-f.large .group{top:145px}.variant-f.large h1{font-size:82.5px}.variant-f.large .actions{margin-top:48px}.variant-f.large .secondary{font-size:22.5px}
.enter #stage{opacity:0}.enter #world{opacity:.95}.enter #veil{opacity:0}
.fade #world{transition:opacity 1.4s ease-out}.variant-c.fade #world,.variant-f.fade #world{opacity:0}
.fade #veil{opacity:1;transition:opacity 1.4s ease-out}.show #stage{opacity:1;transition:opacity .5s ease-out}
</style>
<div id="world" aria-hidden="true"></div><div id="veil" aria-hidden="true"></div>
<main id="stage"><section class="group"><div class="logo" aria-hidden="true">EMERGENCY<br>SHIFT</div><p class="brand">АВАРИЙНАЯ СМЕНА</p><h1>ВЫ ПОГИБЛИ</h1><div class="rule" aria-hidden="true"></div><p class="point">С начала сцены</p><p class="error">Не удалось загрузить сохранение.<br>Файл сохранён. Попробуйте ещё раз.</p><div class="actions"><button class="active" id="retry">Повторить попытку</button><button class="secondary" id="exit">Выйти из игры</button></div></section><p class="hint">↑ ↓ Выбор &nbsp; Enter Подтвердить &nbsp; R Повторить</p></main>
<script>
const params=new URLSearchParams(location.search),variant=params.get('variant')||'c',state=params.get('state')||'fresh';document.body.classList.add('variant-'+variant,'state-'+state);if(params.has('large'))document.body.classList.add('large');
if(variant==='f')document.querySelector('h1').innerHTML='ВЫ<br>ПОГИБЛИ';
const retry=document.querySelector('#retry'),exit=document.querySelector('#exit'),point=document.querySelector('.point');
if(state==='checkpoint'){retry.textContent='С контрольной точки';point.textContent='Сохранённое состояние'}
if(state==='loading'){retry.textContent='Загрузка…';point.textContent='Подождите';retry.disabled=true;exit.disabled=true}
if(state==='error'){retry.textContent='Попробовать снова';point.textContent='';}
if(state==='exit'){point.textContent='Выйти из игры?';retry.textContent='Остаться';exit.textContent='Выйти';document.querySelector('.hint').textContent='↑ ↓ Выбор   Enter Подтвердить   Esc Остаться'}
const buttons=[retry,exit];let selected=0;function choose(i){selected=(i+2)%2;buttons.forEach((b,j)=>b.classList.toggle('active',selected===j))}
buttons.forEach((b,i)=>{b.onpointermove=()=>choose(i);b.onfocus=()=>choose(i);b.onclick=()=>parent.postMessage({type:'intent',value:b.textContent},'*')});
addEventListener('keydown',e=>{if(retry.disabled||e.repeat)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();choose(selected+1)}if(e.key==='Enter'){e.preventDefault();buttons[selected].click()}if(e.code==='KeyR'&&state!=='exit')retry.click();if(e.key==='Escape'&&state==='exit')retry.click()});
function resize(){const scale=Math.min(innerWidth/1280,innerHeight/720),width=innerWidth/scale,height=innerHeight/scale,stage=document.querySelector('#stage');stage.style.width=width+'px';stage.style.height=height+'px';stage.style.transform='scale('+scale+')';const left=Math.max(90,(width-1100)/2);if(variant==='c'||variant==='e'){document.querySelector('.group').style.left=left+'px';document.querySelector('.hint').style.left=left+'px'}if(variant==='d'){document.querySelector('.group').style.left=Math.max(192,(width-896)/2)+'px';document.querySelector('.hint').style.left=Math.max(192,(width-896)/2)+'px'}}
addEventListener('resize',resize);resize();let timers=[];function replay(){timers.forEach(clearTimeout);document.body.classList.remove('fade','show');document.body.classList.add('enter');timers=[setTimeout(()=>document.body.classList.add('fade'),50),setTimeout(()=>document.body.classList.add('show'),700),setTimeout(()=>document.body.classList.remove('enter','fade','show'),2200)]}addEventListener('message',e=>{if(e.data?.type==='replay')replay()});
window.evidence=()=>[...document.querySelectorAll('.logo,.brand,h1,.point,.error,button,.hint')].filter(e=>getComputedStyle(e).display!=='none').map(e=>{const r=e.getBoundingClientRect();return{text:e.textContent,box:[r.x,r.y,r.width,r.height],overflow:e.scrollWidth>e.clientWidth+1||e.scrollHeight>e.clientHeight+1,inBounds:r.x>=0&&r.y>=0&&r.right<=innerWidth&&r.bottom<=innerHeight}});
</script></html>
