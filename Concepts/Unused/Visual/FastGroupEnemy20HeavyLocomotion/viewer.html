<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TASK-005 · два врага · движение</title>
<style>body{margin:0;background:#20272c;color:#eceeef;font:16px system-ui}main{max-width:1280px;margin:auto;padding:20px}h1{font-size:23px;margin:0 0 8px}p{color:#b6c1c8;margin:8px 0 16px}canvas{display:block;width:100%;background:#292e31;border:1px solid #434d53}button,select,input{font:inherit}button,select{padding:8px 14px;background:#36444d;color:#fff;border:1px solid #61737d;border-radius:5px}button[aria-pressed=true]{background:#096c84}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}.note{font-size:14px}#frame{font-variant-numeric:tabular-nums}a{color:#8bd9ed}</style>
<main><h1>TASK-005 · передвижение двух врагов</h1><p id="description">Исходный бег до правок. Одинаковая скорость, разные фазы шага. Пол движется относительно камеры, следующей за врагами.</p>
<nav><button id="old" aria-pressed="true">Исходный бег</button><button id="new" disabled>Тяжёлая тяга</button><button id="play">Пауза</button><button id="step">+1 кадр</button><select id="speed"><option value="1">100%</option><option value=".5">50%</option><option value=".25">25%</option></select><label><input type="checkbox" id="sync"> Одна фаза</label><span id="frame"></span></nav>
<canvas id="stage" width="1280" height="820"></canvas><p class="note">Два экземпляра одной анимации. Общий масштаб и камера; без звука. Пробел — пауза. При выборе кадра пол и обе фигуры останавливаются вместе.</p></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),button=document.querySelector('#play');
let state='old',playing=true,time=0,last=0,configs={},images={},ready=false;
const scale=.54,ppu=400*scale,pivot=[602.2,511.8],groundSpeed=1.65;
async function load(name,url){const c=await fetch(url).then(r=>{if(!r.ok)throw Error(url);return r.json()});const list=await Promise.all(c.frames.map(path=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=new URL(path,new URL(url,location.href));})));configs[name]=c;images[name]=list;}
function frameAt(seconds,c){let at=((seconds%c.duration)+c.duration)%c.duration,acc=0;for(let i=0;i<c.durationsMs.length;i++){acc+=c.durationsMs[i]/1000;if(at<acc)return i;}return c.frames.length-1;}
function draw(){if(!ready)return;const c=configs[state];ctx.fillStyle='#292e31';ctx.fillRect(0,0,1280,820);const tile=ppu*.5,drift=(time*groundSpeed*ppu)%tile;ctx.lineWidth=1;ctx.strokeStyle='#394246';ctx.beginPath();for(let x=0;x<=1280;x+=tile){ctx.moveTo(x,0);ctx.lineTo(x,820);}for(let y=-tile;y<820+tile;y+=tile){ctx.moveTo(0,y-drift);ctx.lineTo(1280,y-drift);}ctx.stroke();
 const indices=[];for(let k=0;k<2;k++){const age=time*groundSpeed/c.referenceSpeed+(k&&!document.querySelector('#sync').checked?c.duration*.27:0),i=frameAt(age,c);indices.push(i);ctx.save();ctx.translate(k?920:360,420);ctx.rotate(-Math.PI/2);ctx.drawImage(images[state][i],-pivot[0]*scale,-pivot[1]*scale,1024*scale,1024*scale);ctx.restore();ctx.fillStyle='#c8d2d7';ctx.font='18px system-ui';ctx.textAlign='center';ctx.fillText('Враг '+(k+1),k?920:360,85);}
ctx.textAlign='left';ctx.fillStyle='#a7b4bb';ctx.font='16px system-ui';ctx.fillText((state==='old'?'Исходный бег':'Новая тяжёлая тяга')+' · 1.65 ед/с',24,785);document.querySelector('#frame').textContent=indices.map(i=>String(i).padStart(2,'0')).join(' / ');}
function loop(ms){if(last&&playing)time+=(ms-last)/1000*Number(document.querySelector('#speed').value);last=ms;draw();requestAnimationFrame(loop);}
function pause(){playing=!playing;button.textContent=playing?'Пауза':'Пуск';draw();}
function setState(name){if(!configs[name])return;state=name;time=0;document.querySelector('#old').setAttribute('aria-pressed',name==='old');document.querySelector('#new').setAttribute('aria-pressed',name==='new');document.querySelector('#description').textContent=name==='old'?'Исходный бег до правок. Два экземпляра с разными фазами.':'Новая тяжёлая тяга на утверждённом дизайне с жвалами. Сравни на обычной скорости.';draw();history.replaceState(null,'','?state='+name);}
button.onclick=pause;document.querySelector('#step').onclick=()=>{playing=false;button.textContent='Пуск';const c=configs[state],i=frameAt(time*groundSpeed/c.referenceSpeed,c);time+=c.durationsMs[i]/1000*c.referenceSpeed/groundSpeed;draw();};document.querySelector('#old').onclick=()=>setState('old');document.querySelector('#new').onclick=()=>setState('new');document.querySelector('#sync').onchange=draw;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pause();}});
window.motionReview={pauseAt(t,s='old'){setState(s);playing=false;time=t;button.textContent='Пуск';draw();},play(s){if(s)setState(s);playing=true;button.textContent='Пауза';},getState(){return{state,time,playing,frames:document.querySelector('#frame').textContent};}};
load('old','old.json').then(()=>{ready=true;draw();requestAnimationFrame(loop);return load('new','new.json');}).then(()=>{document.querySelector('#new').disabled=false;const params=new URLSearchParams(location.search);if(params.get('state')==='new')setState('new');if(params.has('frame')){const c=configs[state];time=Number(params.get('frame'))*c.durationsMs[0]/1000*c.referenceSpeed/groundSpeed;playing=false;button.textContent='Пуск';draw();}}).catch(e=>{if(!ready)document.querySelector('#description').textContent='Ошибка загрузки: '+e.message;});
</script></html>
