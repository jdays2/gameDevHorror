<g id="Vzero"><title>V · из подвала</title>
<rect x="60" y="850" width="220" height="120" fill="#e4e9ed" stroke="#273039" stroke-width="2"/>
<polyline points="60,850 280,850 280,970 60,970 60,850" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="74" y="871" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">V 0</text>
<text x="74" y="894" font-size="19" font-weight="700" text-anchor="start" fill="#273039">V · из подвала</text>
<text x="74" y="920" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Та же лестница</text>
<text x="74" y="940" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Связь с V на странице −1</text>
</g>
<g id="U1"><title>Пост / наблюдение</title>
<rect x="360" y="850" width="240" height="120" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="360,850 600,850 600,970 360,970 360,850" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="374" y="871" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">U1</text>
<text x="374" y="894" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Пост / наблюдение</text>
<text x="374" y="920" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Вид II: реакция на свет</text>
<text x="374" y="940" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Показать до выбора пути</text>
</g>
<g id="C11"><title>A · короткий коридор</title>
<rect x="720" y="850" width="250" height="120" fill="#edf0f2" stroke="#59636c" stroke-width="2"/>
<polyline points="720,850 970,850 970,970 720,970 720,850" fill="none" stroke="#59636c" stroke-width="2" stroke-linejoin="round"/>
<text x="734" y="871" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">C11</text>
<text x="734" y="894" font-size="19" font-weight="700" text-anchor="start" fill="#273039">A · короткий коридор</text>
<text x="734" y="920" font-size="16" font-weight="400" text-anchor="start" fill="#273039">E4 · провокация светом</text>
<text x="734" y="940" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Правила обнаружения</text>
<text x="734" y="960" font-size="16" font-weight="400" text-anchor="start" fill="#273039">уточнить</text>
</g>
<g id="U2"><title>B · диагностика</title>
<rect x="360" y="550" width="250" height="150" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="360,550 610,550 610,700 360,700 360,550" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="374" y="571" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">U2</text>
<text x="374" y="594" font-size="19" font-weight="700" text-anchor="start" fill="#273039">B · диагностика</text>
<text x="374" y="620" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Сталкер · знакомая угроза</text>
<text x="374" y="640" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Дольше; поведение понятнее</text>
<text x="374" y="660" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Можно пройти без зачистки</text>
</g>
<g id="C12"><title>Служебный обход</title>
<rect x="720" y="550" width="250" height="150" fill="#edf0f2" stroke="#59636c" stroke-width="2"/>
<polyline points="720,550 970,550 970,700 720,700 720,550" fill="none" stroke="#59636c" stroke-width="2" stroke-linejoin="round"/>
<text x="734" y="571" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">C12</text>
<text x="734" y="594" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Служебный обход</text>
<text x="734" y="620" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Продолжение пути B</text>
<text x="734" y="640" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Повороты и чтение звука</text>
</g>
<g id="U3"><title>Узел лабораторий</title>
<rect x="1110" y="650" width="250" height="120" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="1110,650 1360,650 1360,770 1110,770 1110,650" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="1124" y="671" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">U3</text>
<text x="1124" y="694" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Узел лабораторий</text>
<text x="1124" y="720" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Оба пути сходятся здесь</text>
<text x="1124" y="740" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Выбор: награда или дальше</text>
</g>
<g id="S2"><title>S2 · скрытый архив</title>
<rect x="720" y="310" width="250" height="130" fill="#ffffff" stroke="#65717c" stroke-width="2" stroke-dasharray="2 6"/>
<polyline points="720,310 970,310 970,440 720,440 720,310" fill="none" stroke="#65717c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="2 6"/>
<text x="734" y="331" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">S2</text>
<text x="734" y="354" font-size="19" font-weight="700" text-anchor="start" fill="#273039">S2 · скрытый архив</text>
<text x="734" y="380" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Секрет, можно пропустить</text>
<text x="734" y="400" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Отдельно от боевой награды</text>
</g>
<g id="UO1"><title>UO1 · хранилище</title>
<rect x="1130" y="460" width="230" height="130" fill="#ffffff" stroke="#273039" stroke-width="2" stroke-dasharray="9 5"/>
<polyline points="1130,460 1360,460 1360,590 1130,590 1130,460" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 5"/>
<text x="1144" y="481" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">UO1</text>
<text x="1144" y="504" font-size="19" font-weight="700" text-anchor="start" fill="#273039">UO1 · хранилище</text>
<text x="1144" y="530" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Бой со Сталкером (необяз.)</text>
<text x="1144" y="550" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Улучшение оружия</text>
</g>
<g id="U4"><title>Третья роль</title>
<rect x="1110" y="160" width="250" height="150" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="1110,160 1360,160 1360,310 1110,310 1110,160" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="1124" y="181" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">U4</text>
<text x="1124" y="204" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Третья роль</text>
<text x="1124" y="230" font-size="16" font-weight="400" text-anchor="start" fill="#273039">E5 · знакомство перед</text>
<text x="1124" y="250" font-size="16" font-weight="400" text-anchor="start" fill="#273039">финалом</text>
<text x="1124" y="270" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Тип III ещё не определён</text>
<text x="1124" y="290" font-size="16" font-weight="400" text-anchor="start" fill="#273039">До смешения видов на арене</text>
</g>
<g id="U5"><title>Подход к финалу</title>
<rect x="720" y="160" width="250" height="130" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="720,160 970,160 970,290 720,290 720,160" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="734" y="181" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">U5</text>
<text x="734" y="204" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Подход к финалу</text>
<text x="734" y="230" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Предупреждение / подготовка</text>
<text x="734" y="250" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Запасы и повтор боя —</text>
<text x="734" y="270" font-size="16" font-weight="400" text-anchor="start" fill="#273039">открыто</text>
</g>
<g id="A1"><title>Финальная арена / боссфайт</title>
<rect x="60" y="160" width="530" height="210" fill="#e4e9ed" stroke="#273039" stroke-width="2"/>
<polyline points="60,160 590,160 590,370 60,370 60,160" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="74" y="181" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">A1</text>
<text x="74" y="204" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Финальная арена / боссфайт</text>
<text x="74" y="230" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Три вида монстров; состав и фазы открыты</text>
<text x="74" y="250" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Манёвр, смена позиции, работа со светом</text>
<text x="74" y="270" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Проходима без необязательных улучшений*</text>
</g>
<g id="RESULT"><title>Завершение демо</title>
<rect x="60" y="450" width="260" height="120" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="60,450 320,450 320,570 60,570 60,450" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="74" y="471" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">RESULT</text>
<text x="74" y="494" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Завершение демо</text>
<text x="74" y="520" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Убийства · улучшения · секреты</text>
<text x="74" y="540" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Итоговая статистика</text>
</g>
<polyline points="60,1055 1440,1055" fill="none" stroke="#bdc5cc" stroke-width="1" stroke-linejoin="round"/>
<text x="60" y="1086" font-size="18" font-weight="400" text-anchor="start" fill="#273039">Сплошная → порядок движения; проходы двусторонние.  Пунктир — необязательно.  Точки — скрыто.</text>
<text x="60" y="1115" font-size="18" font-weight="400" text-anchor="start" fill="#273039">A / B — два полноценных пути. A короче, но требует читать угрозу при ограниченной информации.</text>
<text x="60" y="1142" font-size="18" font-weight="400" text-anchor="start" fill="#273039">Сталкеры до финала — в U2 и UO1. Выключенный фонарь не означает невидимость.</text>
<text x="60" y="1169" font-size="18" font-weight="400" text-anchor="start" fill="#273039">Тип III, босс и правила арены открыты. U4 — место знакомства с ролью, а не утверждённый враг.</text>
<text x="60" y="1190" font-size="16" font-weight="400" text-anchor="start" fill="#59636c">* Цель баланса: финал без побочных наград. Цель длительности демо 30 / 50 минут требует игрового теста.</text>
</svg>
