<text x="60" y="45" font-size="29" font-weight="700" text-anchor="start" fill="#273039">0  БОЛЬНИЧНЫЙ / ЛАБОРАТОРНЫЙ ЭТАЖ</text>
<text x="60" y="80" font-size="21" font-weight="400" text-anchor="start" fill="#273039">Темнота сохраняется. Меняем отношение к свету и даём выбор маршрута.</text>
<text x="60" y="112" font-size="18" font-weight="400" text-anchor="start" fill="#59636c">ПРЕДЛОЖЕНИЕ · схема связей, не план стен · не в масштабе</text>
