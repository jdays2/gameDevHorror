<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1200" viewBox="0 0 1500 1200">
<style>text{font-family:"Segoe UI",Arial,sans-serif}</style>
<rect width="1500" height="1200" fill="#fafafa"/>
<text x="60" y="45" font-size="29" font-weight="700" text-anchor="start" fill="#273039">−1  ПОДВАЛ / МОРГОВЫЙ БЛОК</text>
<text x="60" y="80" font-size="21" font-weight="400" text-anchor="start" fill="#273039">Холод, сырость, темнота. Медленные Сталкеры до обнаружения.</text>
<text x="60" y="112" font-size="18" font-weight="400" text-anchor="start" fill="#59636c">ПРЕДЛОЖЕНИЕ · схема связей, не план стен · не в масштабе</text>
