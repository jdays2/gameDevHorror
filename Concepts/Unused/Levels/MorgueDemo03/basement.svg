</g>
<g id="B01"><title>Морг / пробуждение</title>
<rect x="60" y="690" width="230" height="130" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="60,690 290,690 290,820 60,820 60,690" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="74" y="711" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">B01</text>
<text x="74" y="734" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Морг / пробуждение</text>
<text x="74" y="760" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Труп рядом; осмотр</text>
<text x="74" y="780" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Место будущего обучения</text>
</g>
<g id="C01"><title>Транспортный узел</title>
<rect x="390" y="690" width="250" height="130" fill="#edf0f2" stroke="#59636c" stroke-width="2"/>
<polyline points="390,690 640,690 640,820 390,820 390,690" fill="none" stroke="#59636c" stroke-width="2" stroke-linejoin="round"/>
<text x="404" y="711" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">C01</text>
<text x="404" y="734" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Транспортный узел</text>
<text x="404" y="760" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Рано узнаём о подъёме</text>
<text x="404" y="780" font-size="16" font-weight="400" text-anchor="start" fill="#273039">D1 пока закрыта с этой</text>
<text x="404" y="800" font-size="16" font-weight="400" text-anchor="start" fill="#273039">стороны</text>
</g>
<g id="C02"><title>Коридор с поворотом</title>
<rect x="390" y="440" width="250" height="130" fill="#edf0f2" stroke="#59636c" stroke-width="2"/>
<polyline points="390,440 640,440 640,570 390,570 390,440" fill="none" stroke="#59636c" stroke-width="2" stroke-linejoin="round"/>
<text x="404" y="461" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">C02</text>
<text x="404" y="484" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Коридор с поворотом</text>
<text x="404" y="510" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Наблюдение до контакта</text>
<text x="404" y="530" font-size="16" font-weight="400" text-anchor="start" fill="#273039">E1 · первый спокойный</text>
<text x="404" y="550" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Сталкер</text>
</g>
<g id="B02"><title>Секционный зал</title>
<rect x="60" y="160" width="290" height="180" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="60,160 350,160 350,340 60,340 60,160" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="74" y="181" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">B02</text>
<text x="74" y="204" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Секционный зал</text>
<text x="74" y="230" font-size="16" font-weight="400" text-anchor="start" fill="#273039">E2 · основная схватка подвала</text>
<text x="74" y="250" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Больше места для манёвра</text>
<text x="74" y="270" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Отход, перезарядка, свет</text>
</g>
<g id="C03"><title>Боковая галерея</title>
<rect x="440" y="160" width="230" height="180" fill="#edf0f2" stroke="#59636c" stroke-width="2"/>
<polyline points="440,160 670,160 670,340 440,340 440,160" fill="none" stroke="#59636c" stroke-width="2" stroke-linejoin="round"/>
<text x="454" y="181" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">C03</text>
<text x="454" y="204" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Боковая галерея</text>
<text x="454" y="230" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Два выхода в зал B02</text>
<text x="454" y="250" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Петля для смены позиции</text>
<text x="454" y="270" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Отсюда — дальше в блок</text>
</g>
<g id="B03"><title>Моечная / сервис</title>
<rect x="780" y="160" width="250" height="180" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="780,160 1030,160 1030,340 780,340 780,160" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="794" y="181" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">B03</text>
<text x="794" y="204" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Моечная / сервис</text>
<text x="794" y="230" font-size="16" font-weight="400" text-anchor="start" fill="#273039">E3 · применение освоенного</text>
<text x="794" y="250" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Теснее, чем в B02</text>
<text x="794" y="270" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Контроль направления света</text>
</g>
<g id="C04"><title>Возвратный коридор</title>
<rect x="780" y="440" width="250" height="130" fill="#edf0f2" stroke="#59636c" stroke-width="2"/>
<polyline points="780,440 1030,440 1030,570 780,570 780,440" fill="none" stroke="#59636c" stroke-width="2" stroke-linejoin="round"/>
<text x="794" y="461" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">C04</text>
<text x="794" y="484" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Возвратный коридор</text>
<text x="794" y="510" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Передышка между встречами</text>
<text x="794" y="530" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Узнавание прежнего узла</text>
</g>
<g id="B04"><title>Служебная площадка</title>
<rect x="1150" y="440" width="250" height="130" fill="#ffffff" stroke="#273039" stroke-width="2"/>
<polyline points="1150,440 1400,440 1400,570 1150,570 1150,440" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="1164" y="461" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">B04</text>
<text x="1164" y="484" font-size="19" font-weight="700" text-anchor="start" fill="#273039">Служебная площадка</text>
<text x="1164" y="510" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Выход из моргового блока</text>
<text x="1164" y="530" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Подход к подъёму</text>
</g>
<g id="Vminus"><title>V · лестница наверх</title>
<rect x="1150" y="690" width="250" height="130" fill="#e4e9ed" stroke="#273039" stroke-width="2"/>
<polyline points="1150,690 1400,690 1400,820 1150,820 1150,690" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round"/>
<text x="1164" y="711" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">V −1</text>
<text x="1164" y="734" font-size="19" font-weight="700" text-anchor="start" fill="#273039">V · лестница наверх</text>
<text x="1164" y="760" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Открываем D1 с дальней</text>
<text x="1164" y="780" font-size="16" font-weight="400" text-anchor="start" fill="#273039">стороны</text>
<text x="1164" y="800" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Связь с V на странице 0</text>
</g>
<g id="BO1"><title>BO1 · запасник</title>
<rect x="60" y="900" width="250" height="130" fill="#ffffff" stroke="#273039" stroke-width="2" stroke-dasharray="9 5"/>
<polyline points="60,900 310,900 310,1030 60,1030 60,900" fill="none" stroke="#273039" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 5"/>
<text x="74" y="921" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">BO1</text>
<text x="74" y="944" font-size="19" font-weight="700" text-anchor="start" fill="#273039">BO1 · запасник</text>
<text x="74" y="970" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Необязательная зачистка</text>
<text x="74" y="990" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Награда: улучшение фонаря</text>
</g>
<g id="S1"><title>S1 · скрытая камера</title>
<rect x="1150" y="170" width="250" height="150" fill="#ffffff" stroke="#65717c" stroke-width="2" stroke-dasharray="2 6"/>
<polyline points="1150,170 1400,170 1400,320 1150,320 1150,170" fill="none" stroke="#65717c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="2 6"/>
<text x="1164" y="191" font-size="14" font-weight="700" text-anchor="start" fill="#65717c">S1</text>
<text x="1164" y="214" font-size="19" font-weight="700" text-anchor="start" fill="#273039">S1 · скрытая камера</text>
<text x="1164" y="240" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Секрет, можно пропустить</text>
<text x="1164" y="260" font-size="16" font-weight="400" text-anchor="start" fill="#273039">Подсказка и награда открыты</text>
</g>
<polyline points="60,1055 1440,1055" fill="none" stroke="#bdc5cc" stroke-width="1" stroke-linejoin="round"/>
<text x="60" y="1086" font-size="18" font-weight="400" text-anchor="start" fill="#273039">Сплошная → порядок движения; проходы двусторонние.  Пунктир — необязательно.  Точки — скрыто.</text>
<text x="60" y="1115" font-size="18" font-weight="400" text-anchor="start" fill="#273039">B02: посещение обязательно; длительный бой ещё нужно поставить, выходы сами его не обеспечивают.</text>
<text x="60" y="1142" font-size="18" font-weight="400" text-anchor="start" fill="#273039">D1: предложение — засов со стороны лестницы. После открытия сокращает возврат к BO1.</text>
<text x="60" y="1169" font-size="18" font-weight="400" text-anchor="start" fill="#273039">Угол и отход не сбрасывают агрессию. Переход между этажами ещё предстоит определить.</text>
<text x="60" y="1190" font-size="16" font-weight="400" text-anchor="start" fill="#59636c">* Цель баланса: финал без побочных наград. Цель длительности демо 30 / 50 минут требует игрового теста.</text>
</svg>
