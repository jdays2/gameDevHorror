<polyline points="1150,755 640,755" fill="none" stroke="#273039" stroke-width="3" stroke-linejoin="round" stroke-dasharray="14 7"/>
<polyline points="651.0527319280346,750.3269798922962 640,755 651.0527319280346,759.6730201077038" fill="none" stroke="#273039" stroke-width="3" stroke-linejoin="round"/>
<text x="895" y="725" font-size="18" font-weight="400" text-anchor="middle" fill="#273039">D1 · открыть со стороны V</text>
